<svg xmlns="http://www.w3.org/2000/svg"
  width="900"
  height="180"
  viewBox="0 0 900 180">

  <defs>

```
<!-- FUNDO AZUL + VERMELHO -->
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#071a4d"/>
  <stop offset="45%" stop-color="#0b3d91"/>
  <stop offset="55%" stop-color="#b00000"/>
  <stop offset="100%" stop-color="#350000"/>
</linearGradient>

<!-- BRILHO -->
<radialGradient id="glow">
  <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
  <stop offset="45%" stop-color="#ff2020" stop-opacity="0.15"/>
  <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
</radialGradient>

<!-- BRILHO DO TEXTO -->
<filter id="textGlow">
  <feGaussianBlur stdDeviation="3" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<!-- TEIA -->
<pattern id="web"
         width="100"
         height="100"
         patternUnits="userSpaceOnUse">

  <path d="M50 0 V100 M0 50 H100"
        stroke="#ffffff"
        stroke-opacity="0.10"
        fill="none"/>

  <path d="M50 0
           C50 30 70 50 100 50
           M100 50
           C70 50 50 70 50 100
           M50 100
           C50 70 30 50 0 50
           M0 50
           C30 50 50 30 50 0"
        stroke="#ffffff"
        stroke-opacity="0.13"
        fill="none"/>

  <circle cx="50"
          cy="50"
          r="20"
          fill="none"
          stroke="#ffffff"
          stroke-opacity="0.10"/>
</pattern>


<!--
  ÁREA DA DIGITAÇÃO

  O texto começa em X=120.
  A largura máxima é 660px.
-->
<clipPath id="typingClip">

  <rect x="120"
        y="55"
        width="0"
        height="70">

    <animate
      attributeName="width"

      values="
        0;
        0;
        82.5;
        165;
        247.5;
        330;
        412.5;
        495;
        577.5;
        660;
        660;
        0
      "

      keyTimes="
        0;
        0.05;
        0.12;
        0.19;
        0.26;
        0.33;
        0.40;
        0.47;
        0.54;
        0.61;
        0.72;
        1
      "

      dur="8s"
      repeatCount="indefinite"/>

  </rect>

</clipPath>
```

  </defs>

  <!-- FUNDO -->

<rect width="900"
     height="180"
     rx="18"
     fill="url(#bg)"/>

  <!-- BRILHO -->

<ellipse cx="450"
        cy="90"
        rx="430"
        ry="130"
        fill="url(#glow)">

```
<animate
  attributeName="opacity"
  values="0.6;1;0.6"
  dur="3s"
  repeatCount="indefinite"/>
```

  </ellipse>

  <!-- TEIA DE FUNDO -->

<rect width="900"
     height="180"
     rx="18"
     fill="url(#web)"/>

  <!-- TEIA ESQUERDA -->

<g fill="none"
  stroke="#ffffff"
  stroke-opacity="0.35"
  stroke-width="1.5">

```
<path d="M0 0 Q120 90 0 180"/>
<path d="M0 0 Q220 90 0 180"/>
<path d="M0 0 Q320 90 0 180"/>

<path d="M0 0 Q60 45 120 0"/>
<path d="M0 45 Q80 70 170 30"/>
<path d="M0 90 Q100 90 200 70"/>
<path d="M0 135 Q80 110 170 150"/>
<path d="M0 180 Q60 135 120 180"/>
```

  </g>

  <!-- TEIA DIREITA -->

<g fill="none"
  stroke="#ffffff"
  stroke-opacity="0.35"
  stroke-width="1.5">

```
<path d="M900 0 Q780 90 900 180"/>
<path d="M900 0 Q680 90 900 180"/>
<path d="M900 0 Q580 90 900 180"/>

<path d="M900 0 Q840 45 780 0"/>
<path d="M900 45 Q820 70 730 30"/>
<path d="M900 90 Q800 90 700 70"/>
<path d="M900 135 Q820 110 730 150"/>
<path d="M900 180 Q840 135 780 180"/>
```

  </g>

  <!-- BORDA -->

<rect x="3"
     y="3"
     width="894"
     height="174"
     rx="16"
     fill="none"
     stroke="#ffffff"
     stroke-opacity="0.25"
     stroke-width="2"/>

  <!-- TEXTO -->

  <g clip-path="url(#typingClip)">

```
<text x="120"
      y="108"
      text-anchor="start"
      font-family="Fira Code, monospace"
      font-size="24"
      font-weight="bold"
      letter-spacing="0"
      fill="#ffffff"
      filter="url(#textGlow)"
      textLength="660"
      lengthAdjust="spacingAndGlyphs">

  WITH GREAT POWER COME GREAT RESPONSIBILITY

</text>
```

  </g>

  <!--
    CURSOR

    MESMOS KEYTIMES DA DIGITAÇÃO.

    0       = início
    0.05    = começa
    0.61    = frase completa
    0.72    = permanece completa
    1       = volta ao início
  -->

<rect x="120"
     y="78"
     width="3"
     height="38"
     fill="#ffffff">

```
<animate
  attributeName="x"

  values="
    120;
    120;
    202.5;
    285;
    367.5;
    450;
    532.5;
    615;
    697.5;
    780;
    780;
    120
  "

  keyTimes="
    0;
    0.05;
    0.12;
    0.19;
    0.26;
    0.33;
    0.40;
    0.47;
    0.54;
    0.61;
    0.72;
    1
  "

  dur="8s"
  repeatCount="indefinite"/>


<!-- PISCAR DO CURSOR -->
<animate
  attributeName="opacity"
  values="1;0;1"
  dur="0.8s"
  repeatCount="indefinite"/>
```

  </rect>

  <!-- PARTÍCULAS -->

  <g fill="#ffffff">

```
<circle cx="120"
        cy="35"
        r="2">

  <animate
    attributeName="opacity"
    values="0.2;1;0.2"
    dur="1.5s"
    repeatCount="indefinite"/>

</circle>


<circle cx="780"
        cy="145"
        r="2">

  <animate
    attributeName="opacity"
    values="1;0.2;1"
    dur="2s"
    repeatCount="indefinite"/>

</circle>


<circle cx="250"
        cy="145"
        r="1.5">

  <animate
    attributeName="opacity"
    values="0.2;1;0.2"
    dur="1.8s"
    repeatCount="indefinite"/>

</circle>
```

  </g>

</svg>
