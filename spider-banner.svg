<svg xmlns="http://www.w3.org/2000/svg"
     width="900"
     height="180"
     viewBox="0 0 900 180">

  <defs>

    
    <linearGradient id="spiderBG"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="100%">

      <stop offset="0%"   stop-color="#06183f"/>
      <stop offset="38%"  stop-color="#0b3f91"/>
      <stop offset="50%"  stop-color="#151515"/>
      <stop offset="62%"  stop-color="#a90000"/>
      <stop offset="100%" stop-color="#3d0000"/>

    </linearGradient>


   
    <radialGradient id="centerGlow"
                    cx="50%"
                    cy="50%"
                    r="65%">

      <stop offset="0%"
            stop-color="#ffffff"
            stop-opacity="0.22"/>

      <stop offset="35%"
            stop-color="#ff2020"
            stop-opacity="0.10"/>

      <stop offset="70%"
            stop-color="#087cff"
            stop-opacity="0.08"/>

      <stop offset="100%"
            stop-color="#000000"
            stop-opacity="0"/>

    </radialGradient>


  
    <filter id="textGlow"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%">

      <feGaussianBlur
        stdDeviation="3"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>


   
    <pattern id="webPattern"
             width="100"
             height="100"
             patternUnits="userSpaceOnUse">

      <path d="M50 0 V100"
            stroke="#ffffff"
            stroke-opacity="0.09"
            fill="none"/>

      <path d="M0 50 H100"
            stroke="#ffffff"
            stroke-opacity="0.09"
            fill="none"/>

      <path d="M50 0
               C50 28 72 50 100 50
               C72 50 50 72 50 100
               C50 72 28 50 0 50
               C28 50 50 28 50 0"

            stroke="#ffffff"
            stroke-opacity="0.12"
            fill="none"/>

      <circle cx="50"
              cy="50"
              r="22"
              fill="none"
              stroke="#ffffff"
              stroke-opacity="0.09"/>

      <circle cx="50"
              cy="50"
              r="40"
              fill="none"
              stroke="#ffffff"
              stroke-opacity="0.07"/>

    </pattern>



